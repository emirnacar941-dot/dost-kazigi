
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dost Kazığı | Online</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: #f5f5f5;
      background: radial-gradient(circle at top, #18352d, #090d0c 65%);
      font-family: Arial, sans-serif; display: grid; place-items: center;
      padding: 20px;
    }
    .panel {
      width: 100%; max-width: 500px; padding: 30px;
      background: #121a17; border: 1px solid #30483d;
      border-radius: 20px; box-shadow: 0 20px 60px #0008;
    }
    h1 { text-align: center; margin: 0 0 8px; color: #7cf0ae; }
    .sub { text-align: center; color: #aabbb1; margin-bottom: 28px; }
    label { display: block; margin: 15px 0 7px; color: #c9d8cf; }
    input {
      width: 100%; padding: 13px; border-radius: 9px;
      border: 1px solid #3b5146; background: #0a100d;
      color: white; font-size: 16px;
    }
    button {
      width: 100%; padding: 13px; margin-top: 12px;
      border: 0; border-radius: 9px; background: #69df9a;
      color: #092013; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    button.secondary { background: #273a30; color: white; }
    button:disabled { opacity: .5; cursor: wait; }
    .line { height: 1px; background: #304238; margin: 24px 0; }
    #status { margin-top: 18px; color: #f4d58a; overflow-wrap: anywhere; }
    #room { display: none; }
    .roomcode { font-size: 30px; letter-spacing: 5px; color: #7cf0ae; text-align: center; }
    #players { padding-left: 22px; line-height: 2; }
    .hint { font-size: 13px; line-height: 1.6; color: #9caea3; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>♠ DOST KAZIĞI</h1>
    <p class="sub">Arkadaşlarınla çevrim içi oyna</p>

    <section id="setup">
      <label for="playerName">Oyuncu adın</label>
      <input id="playerName" maxlength="20" placeholder="Oyuncu adını yaz">

      <button id="createBtn" onclick="createRoom()">Oda Oluştur</button>

      <div class="line"></div>

      <label for="roomCodeInput">Arkadaşının oda kodu</label>
      <input id="roomCodeInput" maxlength="6" placeholder="6 haneli kod">
      <button class="secondary" onclick="joinRoom()">Odaya Katıl</button>
      <p class="hint">Önce Supabase bağlantısı ayarlanmalıdır. Oda kodunu arkadaşlarınla paylaşabilirsin.</p>
    </section>

    <section id="room">
      <p style="text-align:center">ODA KODUN</p>
      <div class="roomcode" id="roomCodeDisplay"></div>
      <p style="text-align:center;color:#aabbb1">Arkadaşların bu kodla katılabilir.</p>
      <div class="line"></div>
      <h3>Oyuncular</h3>
      <ul id="players"></ul>
      <p id="playerCount"></p>
      <button class="secondary" onclick="refreshRoom()">Oyuncu listesini yenile</button>
      <button onclick="leaveRoom()">Odadan Ayrıl</button>
    </section>

    <p id="status">Bağlantı ayarı bekleniyor.</p>
  </main>

  <script>
    // Supabase projenin bilgilerini birazdan buraya ekleyeceğiz.
    const SUPABASE_URL = "SUPABASE_PROJE_URL";
    const SUPABASE_KEY = "SUPABASE_PUBLISHABLE_KEY";

    let db = null;
    let currentRoom = null;
    let currentPlayer = null;
    let refreshTimer = null;

    const $ = id => document.getElementById(id);
    const message = text => $("status").textContent = text;

    function connect() {
      if (SUPABASE_URL === "SUPABASE_PROJE_URL" ||
          SUPABASE_KEY === "SUPABASE_PUBLISHABLE_KEY") {
        message("Supabase bağlantı bilgileri henüz eklenmedi.");
        return false;
      }
      if (!db) db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      return true;
    }

    function makeCode() {
      return String(Math.floor(100000 + Math.random() * 900000));
    }

    function playerName() {
      return $("playerName").value.trim().slice(0, 20);
    }

    async function createRoom() {
      if (!connect()) return;
      const name = playerName();
      if (!name) return message("Önce oyuncu adını yaz.");
      $("createBtn").disabled = true;

      try {
        let result;
        for (let i = 0; i < 5; i++) {
          const code = makeCode();
          result = await db.from("game_rooms").insert({
            room_code: code,
            game_state: {
              players: [{ id: crypto.randomUUID(), name }],
              status: "waiting"
            }
          }).select().single();

          if (!result.error) break;
          if (result.error.code !== "23505") throw result.error;
        }
        if (result.error) throw result.error;
        currentRoom = result.data;
        currentPlayer = result.data.game_state.players[0];
        showRoom();
        startRefresh();
        message("Oda oluşturuldu!");
      } catch (e) {
        message("Oda oluşturulamadı: " + e.message);
      } finally {
        $("createBtn").disabled = false;
      }
    }

    async function joinRoom() {
      if (!connect()) return;
      const name = playerName();
      const code = $("roomCodeInput").value.trim();
      if (!name) return message("Önce oyuncu adını yaz.");
      if (!/^\d{6}$/.test(code)) return message("6 haneli oda kodunu yaz.");

      try {
        const { data, error } = await db.from("game_rooms")
          .select("*").eq("room_code", code).maybeSingle();
        if (error) throw error;
        if (!data) return message("Bu oda bulunamadı.");

        const state = data.game_state || {};
        const players = state.players || [];
        if (players.length >= 4) return message("Bu oda şu an 4 oyuncuyla sınırlı.");
        if (state.status !== "waiting") return message("Bu oyun başlamış.");

        currentPlayer = { id: crypto.randomUUID(), name };
        state.players = [...players, currentPlayer];

        const { data: updated, error: updateError } = await db
          .from("game_rooms").update({ game_state: state })
          .eq("id", data.id).eq("game_state", data.game_state)
          .select().maybeSingle();

        if (updateError) throw updateError;
        if (!updated) return message("Oda değişti. Tekrar katılmayı dene.");
        currentRoom = updated;
        showRoom();
        startRefresh();
        message("Odaya katıldın!");
      } catch (e) {
        message("Katılım başarısız: " + e.message);
      }
    }

    function showRoom() {
      $("setup").style.display = "none";
      $("room").style.display = "block";
      $("roomCodeDisplay").textContent = currentRoom.room_code;
      renderPlayers(currentRoom.game_state.players || []);
    }

    function renderPlayers(players) {
      $("players").replaceChildren();
      players.forEach(p => {
        const li = document.createElement("li");
        li.textContent = p.name + (p.id === currentPlayer?.id ? " (Sen)" : "");
        $("players").appendChild(li);
      });
      $("playerCount").textContent = players.length + " / 4 oyuncu";
    }

    async function refreshRoom() {
      if (!currentRoom || !connect()) return;
      try {
        const { data, error } = await db.from("game_rooms")
          .select("*").eq("id", currentRoom.id).maybeSingle();
        if (error) throw error;
        if (!data) return message("Oda bulunamadı.");
        currentRoom = data;
        renderPlayers(data.game_state.players || []);
        message("Oyuncu listesi güncel.");
      } catch (e) {
        message("Yenileme hatası: " + e.message);
      }
    }

    function startRefresh() {
      clearInterval(refreshTimer);
      refreshTimer = setInterval(refreshRoom, 3000);
    }

    function leaveRoom() {
      clearInterval(refreshTimer);
      currentRoom = null;
      currentPlayer = null;
      $("room").style.display = "none";
      $("setup").style.display = "block";
      message("Odadan ayrıldın.");
    }
  </script>
</body>
</html>
